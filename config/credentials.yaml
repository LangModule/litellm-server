# Reusable provider credentials. Secret values belong in the container environment.
# Loaded through config.yaml's include directive.
credential_list:
  - credential_name: aws-bedrock
    credential_values:
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: os.environ/AWS_REGION_NAME
    credential_info:
      custom_llm_provider: bedrock
      description: Standard AWS Bedrock Runtime

  - credential_name: jina-ai
    credential_values:
      api_key: os.environ/JINA_AI_API_KEY
    credential_info:
      custom_llm_provider: jina_ai
      description: Jina AI embeddings and reranking

  - credential_name: openai
    credential_values:
      api_key: os.environ/OPENAI_API_KEY
    credential_info:
      custom_llm_provider: openai
      description: Direct OpenAI API

  - credential_name: openrouter
    credential_values:
      api_key: os.environ/OPENROUTER_API_KEY
    credential_info:
      custom_llm_provider: openrouter
      description: OpenRouter API

  - credential_name: anthropic
    credential_values:
      api_key: os.environ/ANTHROPIC_API_KEY
    credential_info:
      custom_llm_provider: anthropic
      description: Direct Anthropic Claude API

  - credential_name: cohere
    credential_values:
      api_key: os.environ/COHERE_API_KEY
    credential_info:
      custom_llm_provider: cohere
      description: Direct Cohere API
