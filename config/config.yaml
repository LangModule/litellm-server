# Main LiteLLM configuration, loaded by the Compose startup command.
include:
  - credentials.yaml
  - models.yaml

# Share routing counters and state through Redis. Response caching remains disabled.
router_settings:
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

  # Disable environment credentials and master-key login to the dashboard.
  # The master key remains available for management API requests.
  disable_env_credential_login: true
  # Also block database-password login when Microsoft SSO is configured.
  disable_password_login_when_sso_enabled: true
