# Public model names and provider routes. Credentials are defined in credentials.yaml.
model_list:
  - model_name: nova-2-lite
    litellm_params:
      model: bedrock/us.amazon.nova-2-lite-v1:0
      litellm_credential_name: aws-bedrock
      max_tokens: 4096
    model_info:
      mode: chat

  - model_name: nova-multimodal-embeddings
    litellm_params:
      model: bedrock/amazon.nova-2-multimodal-embeddings-v1:0
      litellm_credential_name: aws-bedrock
    model_info:
      mode: embedding

  - model_name: jina-embeddings-v5-text-small
    litellm_params:
      model: jina_ai/jina-embeddings-v5-text-small
      litellm_credential_name: jina-ai
    model_info:
      mode: embedding

  - model_name: jina-reranker-v3.5
    litellm_params:
      model: jina_ai/jina-reranker-v3.5
      litellm_credential_name: jina-ai
    model_info:
      mode: rerank

  - model_name: gpt-5-mini
    litellm_params:
      model: openai/gpt-5-mini
      litellm_credential_name: openai
    model_info:
      mode: chat

  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      litellm_credential_name: openai
    model_info:
      mode: embedding

  - model_name: text-embedding-3-large
    litellm_params:
      model: openai/text-embedding-3-large
      litellm_credential_name: openai
    model_info:
      mode: embedding

  - model_name: claude-haiku-5-5
    litellm_params:
      model: anthropic/claude-haiku-5-5
      litellm_credential_name: anthropic
    model_info:
      mode: chat

  - model_name: claude-sonnet-5-5
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      litellm_credential_name: anthropic
    model_info:
      mode: chat

  - model_name: cohere-embed-v5.0-pro
    litellm_params:
      model: cohere/embed-v5.0-pro
      litellm_credential_name: cohere
    model_info:
      mode: embedding

  - model_name: cohere-rerank-v5.0-pro
    litellm_params:
      model: cohere/rerank-v5.0-pro
      litellm_credential_name: cohere
    model_info:
      mode: rerank
